name: Working Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Build tests
      run: |
        docker build -t tox .
    - name: Run tests
      run: |
        docker run --name TOX --rm tox tox p --skip-pkg-install
